# MiroFish-Workshop: ein Host, alle Dienste. Nur Caddy ist von außen erreichbar (80/443).
# Werte kommen aus deploy/.env (erzeugt von deploy.sh install).
name: mirofish

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      LLM_API_KEY: ${PROXY_TOKEN}
      LLM_BASE_URL: http://vertex-proxy:8080/v1
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gemini-3.8-flash}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      REPORT_LANGUAGE: ${REPORT_LANGUAGE:-German}
      MAX_ROUNDS_CAP: ${MAX_ROUNDS_CAP:-30}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      EMBEDDING_MODEL: nomic-embed-text
      EMBEDDING_BASE_URL: http://ollama:11434
      SECRET_KEY: ${FLASK_SECRET_KEY}
      FLASK_DEBUG: "False"
    volumes:
      - uploads:/app/backend/uploads
      # OASIS lädt beim ersten Lauf ein BERT-Modell von Hugging Face; Cache überlebt Neustarts
      - hf_cache:/root/.cache/huggingface
    depends_on:
      neo4j:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
      vertex-proxy:
        condition: service_started
    restart: unless-stopped

  vertex-proxy:
    build: ./vertex-proxy
    environment:
      VERTEX_PROJECT: ${GCP_PROJECT}
      VERTEX_LOCATION: ${VERTEX_LOCATION:-eu}
      PROXY_TOKEN: ${PROXY_TOKEN}
      DEFAULT_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      MAX_USD: ${MAX_USD:-50}
    volumes:
      - proxy_data:/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_initial__size: 1g
      NEO4J_server_memory_heap_max__size: 2g
      NEO4J_server_memory_pagecache_size: 1g
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.12.6
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  # Lädt das Embedding-Modell einmalig in das ollama-Volume
  ollama-pull:
    image: ollama/ollama:0.12.6
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["sh", "-c", "sleep 3 && ollama pull nomic-embed-text"]
    depends_on:
      - ollama
    restart: "no"

volumes:
  uploads:
  hf_cache:
  caddy_data:
  caddy_config:
  proxy_data:
  neo4j_data:
  ollama_data:
